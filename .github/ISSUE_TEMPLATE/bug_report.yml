name: Bug report
description: Something on the site or in one of the PHP endpoints behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What is wrong?
      description: A clear description of the incorrect behaviour.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Site / pages (Next.js)
        - Momo assistant (ask.php)
        - Contact form (sendMail.php)
        - Spotify card (spotify-top.php)
        - Arcade
        - Build or deploy scripts
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /en/work
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include console errors or the endpoint's JSON response if relevant.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, and whether this is local (`npm run dev`) or the live site.
      placeholder: Firefox 142, macOS 15, live site
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots or additional context
    validations:
      required: false
