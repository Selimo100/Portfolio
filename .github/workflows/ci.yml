name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main, redesign]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check and build the static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

  php:
    name: Syntax-check the PHP endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: json, mbstring, curl
          coverage: none

      - name: php -l every endpoint and library file
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l
