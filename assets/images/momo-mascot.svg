<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Momo, Selina's portfolio assistant" class="momo-mascot">
  <defs>
    <linearGradient id="momoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FAFD" />
      <stop offset="1" stop-color="#BEDDEB" />
    </linearGradient>
    <linearGradient id="momoVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A33" />
      <stop offset="1" stop-color="#0E1418" />
    </linearGradient>
    <radialGradient id="momoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#84BBD3" stop-opacity="0.45" />
      <stop offset="1" stop-color="#84BBD3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- soft ambient glow -->
  <circle class="momo-glow" cx="32" cy="34" r="27" fill="url(#momoGlow)" />

  <!-- antenna -->
  <path d="M32 11.5 V6.5" stroke="#84BBD3" stroke-width="2.4" stroke-linecap="round" />
  <circle class="momo-spark" cx="32" cy="4.6" r="3" fill="#99D5E8" />

  <!-- body -->
  <rect x="10" y="11" width="44" height="38" rx="15" fill="url(#momoBody)" stroke="#84BBD3" stroke-width="1.6" />
  <!-- glass highlight -->
  <path d="M17 22c1.5-6 7-9.5 13-9.8-6.4 2.3-10 6-11 12.2-.5 2.4-2.6 1.6-2-2.4Z" fill="#FFFFFF" opacity="0.7" />

  <!-- visor -->
  <rect x="17" y="19" width="30" height="20" rx="10" fill="url(#momoVisor)" />
  <g class="momo-eyes" fill="#99D5E8">
    <rect x="24" y="25.5" width="5" height="8" rx="2.5" />
    <rect x="35" y="25.5" width="5" height="8" rx="2.5" />
  </g>

  <!-- side vents -->
  <rect x="6.5" y="26" width="4" height="10" rx="2" fill="#84BBD3" />
  <rect x="53.5" y="26" width="4" height="10" rx="2" fill="#84BBD3" />

  <!-- hover base -->
  <ellipse class="momo-base" cx="32" cy="54" rx="13" ry="3.2" fill="#84BBD3" opacity="0.35" />
</svg>
